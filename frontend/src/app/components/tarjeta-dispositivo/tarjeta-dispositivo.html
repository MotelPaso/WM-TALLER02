<div
  class="flex h-full items-center gap-3 rounded-xl border border-borde bg-white p-3 transition-[border-color,box-shadow,transform] duration-200 ease-salida group-hover:border-borde-fuerte group-active:scale-[0.98] group-active:border-borde-fuerte group-hover:shadow-[0_6px_16px_-6px_rgb(29_27_32/0.14)] sm:p-4"
>
  <span
    class="tarjeta-icono grid size-10 shrink-0 place-items-center rounded-lg estado-{{ dispositivo()?.estado?.nombre }}"
    aria-hidden="true"
  >
    <span class="material-symbols-outlined">{{ icono() }}</span>
  </span>
  <span class="flex min-w-0 flex-1 flex-col gap-1">
    <span class="flex items-center justify-between gap-2">
      <span class="tarjeta-titulo truncate font-medium">{{ dispositivo()?.tipo?.nombre }}</span>
      <span class="etiqueta etiqueta-{{ dispositivo()?.estado?.nombre }} shrink-0">{{ etiqueta() }}</span>
    </span>
    <span class="truncate text-[13px] text-texto-tenue tabular-nums" [title]="detalle()">{{ detalle() }}</span>
  </span>
</div>
