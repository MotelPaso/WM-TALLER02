<!--
  Dispositivos (lista). Ruta /dispositivos.
  HTML estático con datos de ejemplo: los comentarios dicen qué va en cada parte al conectarlo.
  Datos: GET /dispositivos?q=&estado=&tipo_id=&sala_id=  →  lista de dispositivos
    codigo_inventario · tipo.nombre · sala.codigo ("X1-29") · estado.nombre ("operativo", "con_falla"...)
  Los estados de la interfaz (cargando / error / vacío) están al final; cada uno reemplaza a la lista.
-->

<div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-4">
  <div>
    <h1 class="text-[28px] leading-tight font-semibold tracking-tight sm:text-[32px]">Dispositivos</h1>
    <p class="mt-2 max-w-[70ch] text-sm text-texto-suave">Administra y monitorea los dispositivos de las salas
      académicas.</p>
  </div>
  <!-- Solo técnico: @if (esTecnico) -->
  <a matButton="filled" routerLink="/dispositivos/nuevo">
    <span class="material-symbols-outlined" aria-hidden="true">add</span>
    Nuevo dispositivo
  </a>
</div>

<!-- ===== Filtros ===== -->
<div class="mt-6 flex flex-wrap items-center gap-x-2 gap-y-3 sm:mt-8" role="search">
  <label class="relative flex w-full items-center lg:mr-2 lg:w-80">
    <span class="sr-only">Buscar por código</span>
    <span class="material-symbols-outlined pointer-events-none absolute left-4 text-texto-suave"
      aria-hidden="true">search</span>
    <input type="search" placeholder="Buscar por código, tipo o sala" [formControl]="filtros.controls.q"
      class="h-14 w-full rounded-full bg-busqueda pr-5 pl-14 text-base text-texto placeholder:text-texto-suave transition-colors hover:bg-[#e6dfea] focus:bg-white focus:outline-2 focus:outline-primario" />
  </label>

  <app-filtro-select [control]="filtros.controls.estado" [opciones]="opcionesEstados()" etiqueta="Estado"
    textoTodos="Estado: Todos"></app-filtro-select>

  <app-filtro-select [control]="filtros.controls.tipoId" [opciones]="opcionesTipos()" etiqueta="Tipo"
    textoTodos="Tipo: Todos" />

  <app-filtro-select [control]="filtros.controls.salaId" [opciones]="opcionesSalas()" etiqueta="Sala"
    textoTodos="Salas: Todas" />
</div>

<!-- ===== Resumen + selector de vista ===== -->
<div class="mt-6 mb-4 flex flex-wrap items-center justify-between gap-3 text-sm text-texto-suave tabular-nums sm:mt-8">
  <p>{{ dispositivos().length }} dispositivos · {{ salasConDispositivos().length }} salas</p>
  <!-- Vista activa: aria-pressed="true" (cambia el color). (click)="vista.set('sala' | 'cuadricula')" -->
  <div class="flex gap-2" role="group" aria-label="Vista">
    <button type="button" aria-pressed="true"
      class="group inline-flex h-8 items-center gap-2 rounded-lg border border-borde-fuerte px-4 font-medium text-texto-suave transition-colors hover:bg-neutro aria-pressed:border-transparent aria-pressed:bg-primario-contenedor aria-pressed:text-en-primario-contenedor">
      <span class="material-symbols-outlined hidden text-lg group-aria-pressed:inline" aria-hidden="true">check</span>
      Por sala
    </button>
    <button type="button" aria-pressed="false"
      class="group inline-flex h-8 items-center gap-2 rounded-lg border border-borde-fuerte px-4 font-medium text-texto-suave transition-colors hover:bg-neutro aria-pressed:border-transparent aria-pressed:bg-primario-contenedor aria-pressed:text-en-primario-contenedor">
      <span class="material-symbols-outlined hidden text-lg group-aria-pressed:inline" aria-hidden="true">check</span>
      Cuadrícula
    </button>
  </div>
</div>


<div class="grid grid-cols-1 items-start gap-6 xl:grid-cols-2">
  <!-- @for (grupo of porSala(); track grupo.sala) · fondo alterno: bg-[#fdf3ee] en las pares, bg-superficie en las impares -->
  @for (sala of salasConDispositivos(); track sala.id) {
  <app-tarjeta-sala [sala]="sala" [dispositivos]="dispositivos()"></app-tarjeta-sala>
  }
</div>

<!-- ===================================================================
     VISTA "CUADRÍCULA"  →  @else
     Misma tarjeta, pero el tipo va con la sala: "Proyector · X1-29"
     =================================================================== -->
<ul class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
  <!-- @for (d of dispositivos(); track d.id) -->
  <li>
    <a [routerLink]="['/dispositivos', 1]" class="group block h-full rounded-xl text-inherit no-underline">
      <app-tarjeta-dispositivo codigo="UCN-004501" detalle="Proyector · X1-29" />
    </a>
  </li>
</ul>

<!-- ===================================================================
     ESTADOS DE LA INTERFAZ
     =================================================================== -->

<!-- @if (cargando())  →  skeleton con la forma de la tarjeta -->
<ul class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-busy="true"
  aria-label="Cargando dispositivos">
  <!-- @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) -->
  <li class="flex min-h-[118px] flex-col gap-4 rounded-xl border border-borde bg-white p-5">
    <span class="esqueleto h-[22px] w-1/2"></span>
    <span class="flex items-center justify-between">
      <span class="esqueleto h-3.5 w-2/5"></span>
      <span class="esqueleto h-6 w-[72px]"></span>
    </span>
  </li>
</ul>

<!-- @else if (mensajeError())  →  error de carga -->
<app-estado-vacio class="mt-8" tono="error" icono="cloud_off" titulo="No pudimos cargar los dispositivos"
  mensaje="Revisa tu conexión e inténtalo de nuevo.">
  <!-- (click)="cargar()" -->
  <button matButton="filled" type="button">
    <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
    Reintentar
  </button>
</app-estado-vacio>

<!-- @else if (dispositivos().length === 0)  →  sin resultados -->
<app-estado-vacio class="mt-8" icono="search_off" titulo="Sin resultados"
  mensaje="Ningún dispositivo coincide con la búsqueda y los filtros elegidos.">
  <button matButton="outlined" type="button">Limpiar filtros</button>
</app-estado-vacio>
