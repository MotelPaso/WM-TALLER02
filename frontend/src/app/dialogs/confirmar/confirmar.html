<h2 mat-dialog-title>{{ data?.titulo || '¿Estás seguro?' }}</h2>

<mat-dialog-content>
  <p class="text-texto-suave">
    {{ data?.mensaje || 'Esta acción no se puede deshacer.' }}
  </p>

  @if (data?.error) {
    <p role="alert" class="mt-4 flex items-start gap-2.5 rounded-lg bg-[#f8dcdb] px-4 py-3 text-[13px] text-[#9b2f2c]">
      <span class="material-symbols-outlined text-xl" aria-hidden="true">error</span>
      {{ data?.error }}
    </p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="outlined" type="button" [mat-dialog-close]="false">Cancelar</button>
  <button matButton="filled" type="button" class="boton-peligro" [mat-dialog-close]="true">
    {{ data?.accion || 'Eliminar' }}
  </button>
</mat-dialog-actions>
