@if (auth.usuario(); as usuario) {
  <!-- Layout con sesión: header arriba, rail a la izquierda (abajo del header en móvil) -->
  <div
    class="grid min-h-dvh grid-cols-1 grid-rows-[auto_auto_1fr] sm:grid-cols-[96px_minmax(0,1fr)] sm:grid-rows-[auto_1fr]"
  >
    <!-- ===== Header ===== -->
    <header
      class="flex flex-wrap items-center gap-4 bg-superficie px-4 py-4 sm:sticky sm:top-0 sm:z-10 sm:col-span-2 sm:flex-nowrap sm:border-b sm:border-borde sm:px-6 lg:px-8"
    >
      <a routerLink="/dispositivos" class="mr-auto flex items-center gap-3 text-xl font-semibold tracking-tight text-texto no-underline sm:mr-0">
        <span class="grid size-10 place-items-center rounded-lg bg-menta text-marino">
          <span class="material-symbols-outlined" aria-hidden="true">desktop_windows</span>
        </span>
        ReportesUCN
      </a>

      <!-- Búsqueda global (opcional; si no se implementa, se puede quitar) -->
      <label class="relative order-3 flex w-full items-center sm:order-none sm:ml-auto sm:w-80">
        <span class="sr-only">Buscar dispositivo o sala</span>
        <span class="material-symbols-outlined pointer-events-none absolute left-4 text-texto-suave" aria-hidden="true">search</span>
        <input
          type="search"
          placeholder="Buscar dispositivo o sala"
          class="h-14 w-full rounded-full bg-busqueda pr-5 pl-14 text-base text-texto placeholder:text-texto-suave transition-colors hover:bg-[#e6dfea] focus:bg-white focus:outline-2 focus:outline-primario"
        />
      </label>

      <div class="flex items-center gap-2">
        <span
          class="grid size-10 place-items-center rounded-full bg-primario-contenedor text-base font-medium text-en-primario-contenedor"
          [title]="usuario.nombre + ' · ' + usuario.rol.nombre"
          aria-hidden="true"
        >
          {{ usuario.nombre.charAt(0) }}
        </span>
        <button matIconButton type="button" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

    <!-- ===== Navigation rail ===== -->
    <nav
      aria-label="Principal"
      class="sticky top-0 z-10 flex justify-around border-t border-borde bg-superficie px-2 py-3 sm:top-[89px] sm:h-[calc(100dvh-89px)] sm:flex-col sm:justify-center sm:gap-3 sm:border-t-0 sm:border-r sm:px-0 sm:py-4"
    >
      <a
        routerLink="/dispositivos"
        routerLinkActive="activo"
        class="group flex flex-col items-center gap-1 text-xs font-medium tracking-wide text-texto-suave no-underline [&.activo]:text-texto"
      >
        <span
          class="grid h-8 w-14 place-items-center rounded-full transition-colors group-hover:bg-neutro group-[.activo]:bg-primario-contenedor group-[.activo]:text-en-primario-contenedor"
        >
          <span class="material-symbols-outlined group-[.activo]:icono-lleno" aria-hidden="true">devices</span>
        </span>
        Dispositivos
      </a>
      <a
        routerLink="/reportes"
        routerLinkActive="activo"
        class="group flex flex-col items-center gap-1 text-xs font-medium tracking-wide text-texto-suave no-underline [&.activo]:text-texto"
      >
        <span
          class="grid h-8 w-14 place-items-center rounded-full transition-colors group-hover:bg-neutro group-[.activo]:bg-primario-contenedor group-[.activo]:text-en-primario-contenedor"
        >
          <span class="material-symbols-outlined group-[.activo]:icono-lleno" aria-hidden="true">assignment</span>
        </span>
        Reportes
      </a>
    </nav>

    <!-- ===== Contenido de cada página ===== -->
    <main class="min-w-0 px-4 pt-6 pb-12 sm:px-6 sm:pt-8 lg:px-8">
      <router-outlet />
    </main>
  </div>
} @else {
  <!-- Sin sesión: login y registro ocupan toda la pantalla -->
  <router-outlet />
}
